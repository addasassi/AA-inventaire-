name: Migration des photos (une seule fois)
on:
  push:
    paths: ['tools/migrate-photos.mjs', '.github/workflows/migrate-photos.yml']
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save --no-package-lock sharp@0.33
      - run: node tools/migrate-photos.mjs
