name: Coût d'achat 600 DA (une seule fois)
on:
  push:
    paths: ['tools/set-cost.mjs', '.github/workflows/set-cost.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node tools/set-cost.mjs
