name: Application Android (APK)
on:
  push:
    branches: [main]
    paths: ['apk/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: apk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Construction
        env:
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -o pipefail
          bash apk/build.sh 2>&1 | tee build.log
      - name: Publication (page Releases « apk »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="1.0.${GITHUB_RUN_NUMBER}"
          NOTES="Atelier Stock $N — $(date -u +%F). Téléchargez AtelierStock.apk sur le téléphone et installez-le (par-dessus l'ancienne version)."
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Atelier Stock (Android)" --notes "$NOTES"
          gh release upload apk apk/out/AtelierStock.apk apk/out/AtelierStock.aab --clobber
          gh release edit apk --notes "$NOTES"
          echo "{\"version\":\"$N\",\"build\":$((100 + GITHUB_RUN_NUMBER)),\"at\":\"$(date -u +%FT%TZ)\"}" > v.json
          gh release upload apk v.json --clobber
      - name: Journal en cas d'erreur (branche apk-log)
        if: failure()
        run: |
          git config user.name "atelier-stock-bot"; git config user.email "atelier-stock-bot@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "pas de journal" > /tmp/build.log
          git checkout -q --orphan apk-log
          git rm -rq --cached . >/dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -qm "Journal APK $(date -u +%FT%TZ)"
          git push -q -f origin apk-log
