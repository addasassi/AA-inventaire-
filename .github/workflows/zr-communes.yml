name: Communes ZR Express
on:
  push:
    paths: ['tools/zr-communes.mjs', '.github/workflows/zr-communes.yml']
  schedule:
    - cron: '17 3 * * 1'   # chaque lundi (ZR ajoute parfois des communes)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: sleep 150   # laisse le temps au relais d'être redéployé
        if: github.event_name == 'push'
      - run: node tools/zr-communes.mjs
      - run: |
          git config user.name "atelier-stock-bot"; git config user.email "atelier-stock-bot@users.noreply.github.com"
          git add zr-communes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Communes ZR Express mises à jour"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
