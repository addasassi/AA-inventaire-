<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export produits</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  body{font-family:system-ui,sans-serif;background:#fdf2f6;margin:0;padding:24px 16px;text-align:center;color:#3a1f2b}
  h1{font-size:22px;margin:24px 0 8px}
  p{color:#7a5566;margin:0 0 28px}
  button{background:#d63384;color:#fff;border:0;border-radius:14px;padding:18px 28px;font-size:18px;width:100%;max-width:360px}
  button:disabled{opacity:.6}
  #msg{margin-top:20px;font-size:16px;min-height:24px}
</style>
</head>
<body>
  <h1>تصدير المنتوجات</h1>
  <p>Atelier Stock → ملف JSON</p>
  <button id="btn">⬇️ تحميل produits.json</button>
  <div id="msg"></div>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAfMIEi1MynF82Jp1j1J1BFQM5w8182JTo",
  authDomain: "aa-inventaire.firebaseapp.com",
  projectId: "aa-inventaire",
  storageBucket: "aa-inventaire.firebasestorage.app",
  messagingSenderId: "329571073759",
  appId: "1:329571073759:web:ceb6d31bdef660dd25336a"
});
const db = firebase.firestore();
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

btn.onclick = async () => {
  btn.disabled = true;
  msg.textContent = '⏳ راني نجيب المنتوجات...';
  try {
    const snap = await db.collection('products').get();
    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'produits.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    msg.textContent = '✅ ' + data.length + ' منتوج — الملف تنزّل (شوف Téléchargements)';
  } catch (e) {
    msg.textContent = '❌ خطأ: ' + e.message;
  }
  btn.disabled = false;
};
</script>
</body>
</html>
