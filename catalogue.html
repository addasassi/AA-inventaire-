<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>كتالوج المنتوجات — Atelier Stock</title>
<meta name="theme-color" content="#3a2632">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#f6efe9;
    --plum:#3a2632;
    --mauve:#a97c8c;
    --mauve-dark:#6b4152;
    --rose:#e3c9c2;
    --line:#ddc9c1;
    --ok:#5c7a5e;
    --danger:#a4483f;
    --card:#fffdfb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Manrope',sans-serif;
    color:var(--plum);
    -webkit-tap-highlight-color:transparent;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .brand-badge{
    width:38px;height:38px;border-radius:50%;
    border:1.5px solid var(--mauve-dark);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:19px;color:var(--mauve-dark);
    flex-shrink:0;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    color:var(--plum);
  }
  header p{
    margin:8px 0 0;
    font-size:13.5px;
    color:var(--mauve-dark);
  }
  .search-wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 20px 14px;
  }
  .search-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 16px;
  }
  .search-box svg{flex-shrink:0;opacity:.55;}
  .search-box input{
    border:none;background:none;outline:none;
    font-family:'Manrope',sans-serif;
    font-size:15px;color:var(--plum);
    width:100%;
  }
  .search-box input::placeholder{color:#b7a39c;}
  .chips{
    max-width:640px;
    margin:0 auto;
    padding:0 20px 6px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    padding:11px 20px;
    border-radius:999px;
    border:1.3px solid var(--line);
    background:var(--card);
    font-size:14px;
    font-weight:600;
    color:var(--plum);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .chip.active{
    background:var(--plum);
    border-color:var(--plum);
    color:#fff;
  }
  .count{
    max-width:640px;
    margin:0 auto;
    padding:14px 20px 4px;
    font-size:13.5px;
    color:var(--mauve-dark);
    text-align:end;
  }
  .grid{
    max-width:640px;
    margin:0 auto;
    padding:8px 16px 60px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .thumb-wrap{
    position:relative;
    aspect-ratio:1/1;
    background:#efe4dd;
    overflow:hidden;
  }
  .thumb-wrap img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .badge-cat{
    position:absolute;
    top:9px;right:9px;
    background:rgba(58,38,50,.82);
    color:#fff;
    font-size:11px;
    font-weight:600;
    padding:5px 10px;
    border-radius:999px;
    max-width:calc(100% - 18px);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .badge-low{
    position:absolute;
    bottom:9px;right:9px;
    background:var(--danger);
    color:#fff;
    font-size:10.5px;
    font-weight:700;
    padding:4px 9px;
    border-radius:999px;
  }
  .info{
    padding:12px 13px 13px;
  }
  .p-name{
    font-size:14px;
    font-weight:700;
    line-height:1.35;
    margin:0 0 8px;
    min-height:38px;
  }
  .p-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .p-price{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    color:var(--mauve-dark);
  }
  .p-ref{
    font-size:11.5px;
    color:#9a8880;
    direction:ltr;
  }
  .copy-btn{
    width:100%;
    background:var(--rose);
    color:var(--mauve-dark);
    border:none;
    border-radius:12px;
    padding:10px 8px;
    font-family:'Manrope',sans-serif;
    font-size:13px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
  }
  .copy-btn:active{opacity:.7;}
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--mauve-dark);
    font-size:14px;
  }
  .toast{
    position:fixed;
    bottom:22px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--plum);
    color:#fff;
    padding:11px 22px;
    border-radius:12px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
    max-width:88%;
    text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(min-width:520px){
    .grid{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-badge">A</div>
    <h1>كتالوج المنتوجات</h1>
  </div>
  <p>أحدث المنتوجات — اختاري الصورة وابعتيها لينا في Messenger</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="ابحثي عن منتوج…">
  </div>
</div>

<div class="chips" id="chips"></div>
<div class="count" id="count"></div>
<div id="grid" class="grid"></div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAfMIEi1MynF82Jp1j1J1BFQM5w8182JTo",
  authDomain: "aa-inventaire.firebaseapp.com",
  projectId: "aa-inventaire",
  storageBucket: "aa-inventaire.firebasestorage.app",
  messagingSenderId: "329571073759",
  appId: "1:329571073759:web:ceb6d31bdef660dd25336a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allProducts = [];
let activeCat = 'ALL';
let searchTerm = '';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=> t.classList.remove('show'), 2200);
}

function refFor(p){
  const raw = (p.code || p.id || '').toString();
  return 'REF-' + raw.slice(-4);
}

function renderChips(){
  const cats = [];
  allProducts.forEach(p=>{ if(p.cat && !cats.includes(p.cat)) cats.push(p.cat); });
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (activeCat==='ALL' ? ' active' : '');
  allChip.textContent = 'الكل';
  allChip.onclick = ()=>{ activeCat='ALL'; renderChips(); renderGrid(); };
  wrap.appendChild(allChip);
  cats.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'chip' + (activeCat===c ? ' active' : '');
    el.textContent = c;
    el.onclick = ()=>{ activeCat=c; renderChips(); renderGrid(); };
    wrap.appendChild(el);
  });
}

function renderGrid(){
  let list = allProducts.filter(p => (p.qty||0) > 0);
  if(activeCat !== 'ALL') list = list.filter(p => p.cat === activeCat);
  if(searchTerm.trim()){
    const s = searchTerm.trim().toLowerCase();
    list = list.filter(p =>
      (p.name||'').toLowerCase().includes(s) ||
      (p.cat||'').toLowerCase().includes(s) ||
      (p.code||'').includes(s)
    );
  }
  list.sort((a,b)=> (a.order||0) - (b.order||0));

  document.getElementById('count').textContent = list.length + ' موديل';

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  if(!list.length){
    grid.innerHTML = '<div class="empty">مفماش موديلات توافق البحث حاليا</div>';
    return;
  }

  list.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb-wrap';
    const img = document.createElement('img');
    img.src = p.img || '';
    img.alt = p.name || '';
    img.loading = 'lazy';
    thumb.appendChild(img);

    const catBadge = document.createElement('div');
    catBadge.className = 'badge-cat';
    catBadge.textContent = p.cat || '';
    thumb.appendChild(catBadge);

    if((p.qty||0) > 0 && p.qty <= 3){
      const low = document.createElement('div');
      low.className = 'badge-low';
      low.textContent = 'الكمية قليلة';
      thumb.appendChild(low);
    }

    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = `
      <div class="p-name">${p.name || ''}</div>
      <div class="p-row">
        <div class="p-price">${(p.price||0)} دج</div>
        <div class="p-ref">${refFor(p)}</div>
      </div>
    `;

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> نسخ الصورة`;
    btn.onclick = ()=> copyImage(p);

    info.appendChild(btn);
    card.appendChild(thumb);
    card.appendChild(info);
    grid.appendChild(card);
  });
}

async function copyImage(p){
  if(!p.img){ toast('ماكانش صورة لهذا المنتوج'); return; }
  try{
    const res = await fetch(p.img);
    const blob = await res.blob();
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([ new ClipboardItem({ [blob.type]: blob }) ]);
      toast('تنسخت الصورة! روحي لـ Messenger وحطيها فالمحادثة');
      return;
    }
    throw new Error('clipboard not supported');
  }catch(e){
    downloadImage(p);
  }
}

function downloadImage(p){
  const a = document.createElement('a');
  a.href = p.img;
  a.download = (p.name || 'produit').replace(/[^\p{L}\p{N}_-]+/gu,'_') + '.jpg';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('تحملت الصورة! زيديها فـ Messenger من الصور');
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderGrid();
});

db.collection('products').onSnapshot(snap=>{
  allProducts = snap.docs.map(d=> d.data());
  renderChips();
  renderGrid();
}, err=>{
  document.getElementById('grid').innerHTML = '<div class="empty">تعذر تحميل المنتوجات، تأكدي من الاتصال بالانترنت</div>';
});
</script>
</body>
</html>
