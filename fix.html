<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تصليح المخزون — أتيليي ستوك</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#f6efe9; --plum:#3a2632; --mauve-dark:#6b4152;
    --rose:#e3c9c2; --line:#ddc9c1; --danger:#a4483f; --card:#fffdfb;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);font-family:Manrope,sans-serif;color:var(--plum);padding:16px;}
  h1{font-size:19px;margin:0 0 4px;}
  p.sub{font-size:13px;color:var(--mauve-dark);margin:0 0 18px;}
  .row{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;
  }
  .row img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--rose);flex-shrink:0;}
  .row .info{flex:1;min-width:0;font-size:13px;line-height:1.5;}
  .row .info b{font-size:14px;}
  .row .warn{color:var(--danger);font-weight:700;}
  .row button{
    background:var(--danger);color:#fff;border:none;border-radius:8px;
    padding:9px 14px;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;
  }
  .row button:disabled{opacity:.5;}
  .empty{text-align:center;padding:40px 10px;color:var(--mauve-dark);}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--plum);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<h1>كل المنتوجات المسجلة في القاعدة</h1>
<p class="sub">هذه الأداة توري كل منتوج موجود فعليا في قاعدة البيانات، حتى إذا فئته ما تطابقش وحدة من فئات أتيليي ستوك (وهذا سبب اختفائه من فولدرات التطبيق). الفئات اللي بالأحمر هي اللي ما تطابقش.</p>
<div id="list"></div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAfMIEi1MynF82Jp1j1J1BFQM5w8182JTo",
  authDomain: "aa-inventaire.firebaseapp.com",
  projectId: "aa-inventaire",
  storageBucket: "aa-inventaire.firebasestorage.app",
  messagingSenderId: "329571073759",
  appId: "1:329571073759:web:ceb6d31bdef660dd25336a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const KNOWN_CATS = ["Pyjamas","Bustier Short","Fond de robe","Nuisettes","Robes de chambre"];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2000);
}

async function loadAll(){
  const snap = await db.collection('products').get();
  const products = snap.docs.map(d=>d.data());
  render(products);
}

function render(products){
  const wrap = document.getElementById('list');
  if(products.length === 0){
    wrap.innerHTML = '<div class="empty">ماكانش حتى منتوج في القاعدة.</div>';
    return;
  }
  wrap.innerHTML = products.map(p=>{
    const orphan = !KNOWN_CATS.includes(p.cat);
    const ref = (p.code || p.id || '').toString().slice(-4);
    return `<div class="row" data-id="${p.id}">
      <img src="${p.img || ''}">
      <div class="info">
        <b>${p.name || '(بلا اسم)'}</b> — REF-${ref}<br>
        الفئة: <span class="${orphan?'warn':''}">${p.cat || '(بلا فئة)'}</span>${orphan ? ' ⚠️ ما تطابقش فئة معروفة' : ''}<br>
        السعر: ${p.price||0} دج — الكمية: ${p.qty||0}
      </div>
      <button onclick="removeProduct('${p.id}', this)">حذف</button>
    </div>`;
  }).join('');
}

async function removeProduct(id, btn){
  if(!confirm('متأكدة تحبي تحذفي هذا المنتوج نهائيا؟')) return;
  btn.disabled = true;
  btn.textContent = '...';
  try{
    await db.collection('products').doc(id).delete();
    toast('تم الحذف');
    document.querySelector(`.row[data-id="${id}"]`).remove();
  }catch(e){
    toast('صار خطأ، عاودي المحاولة');
    btn.disabled = false;
    btn.textContent = 'حذف';
  }
}

loadAll();
</script>
</body>
</html>
